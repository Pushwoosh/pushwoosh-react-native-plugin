appId: ${APP_ID}
---
- tapOn:
    id: "modal-rich-media-switch"
- assertVisible:
    id: "modal-rich-media-switch"
    checked: true
- launchApp
- runFlow:
    file: wait-for-app.yaml
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "modal-rich-media-switch"
      checked: true
    timeout: 10000
- tapOn:
    id: "modal-rich-media-switch"
- assertVisible:
    id: "modal-rich-media-switch"
    checked: false
