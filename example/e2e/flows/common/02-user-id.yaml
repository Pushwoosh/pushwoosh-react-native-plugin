# setUserId reaches the server and the id reads back through getUserId.
appId: ${APP_ID}
---
- launchApp
- runFlow:
    file: lib/wait-for-app.yaml
# An empty field never reaches the SDK: iOS would take it, overwrite the id on the server and
# report success, Android would call back neither way.
- tapOn:
    id: "set-user-id"
- assertVisible:
    id: "result"
    text: "User ID must not be empty"
- tapOn:
    id: "set-user-id-input"
- inputText: "e2e-user"
- tapOn:
    id: "set-user-id"
- extendedWaitUntil:
    visible:
      id: "result"
      text: "User ID set: e2e-user"
    timeout: 30000
- runFlow:
    when:
      visible: "CLOSE"
    file: lib/dismiss-in-app.yaml
# The keyboard covers the lower half of the screen, and the getters live below the setters.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "get-user-id"
    direction: DOWN
- tapOn:
    id: "get-user-id"
- assertVisible:
    id: "result"
    text: "User ID: e2e-user"
